name: agentorch tracker

on:
  pull_request_target:
    types: [opened, reopened, edited, closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agentorch-tracker-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      vars.AGENTORCH_SYNC_TRACKER == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'closed' || github.event.pull_request.merged)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read tracker configuration and any bridge from the trusted default branch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install Agentorch
        env:
          TRACKER_REF: ${{ vars.AGENTORCH_TRACKER_REF }}
        run: |
          set -euo pipefail
          ref="${TRACKER_REF:-main}"
          [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          python3 -m venv "$RUNNER_TEMP/agentorch"
          "$RUNNER_TEMP/agentorch/bin/pip" install "git+https://github.com/Samprab06/agentorch@${ref}"
      - name: Sync linked ticket
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          AGENTORCH_TRACKER_COMMAND: ${{ vars.AGENTORCH_TRACKER_COMMAND }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          "$RUNNER_TEMP/agentorch/bin/agentorch" tracker sync-pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
